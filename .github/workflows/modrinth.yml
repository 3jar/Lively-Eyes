# Keeps the Modrinth page in step with this repository: uploads new art/
# images to the gallery and sets the description (README.md), the summary
# (the repository's About) and the icon (see src/lively_eyes/modrinth.py).
# Editing the About doesn't trigger a run; use Run workflow after it.
name: Modrinth page

on:
  push:
    branches: [main]
    paths:
      - README.md
      - "art/**"
      - src/lively_eyes/modrinth.py
  workflow_dispatch:

concurrency: modrinth

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync with Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::MODRINTH_TOKEN is not set; the Modrinth page was not updated"
            exit 0
          fi
          python3 -m lively_eyes.modrinth
